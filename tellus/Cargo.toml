[package]
name          = "tellus"
description   = "An actor framework for Rust: typed messages, supervision trees, death watch, event sourcing."
version       = "0.5.2"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/tellus/latest/tellus/"
keywords      = [ "actor", "actors", "actor-model", "supervision", "event-sourcing" ]
categories    = [ "concurrency", "asynchronous" ]
publish       = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
cluster = [
    "dep:erased-serde",
    "dep:postcard",
    "dep:quinn",
    "dep:rustls",
    "dep:serde",
    "dep:trait-variant",
    "dep:x509-parser",
    "uuid/serde",
]
# Enables `QuicTransport::dev`, which does not verify certificates: never enable in production!
cluster-dev           = [ "cluster", "dep:rcgen" ]
hotpath               = [ "dep:hotpath", "hotpath/hotpath" ]
hotpath-alloc         = [ "hotpath", "hotpath/hotpath-alloc" ]
hotpath-callgrind     = [ "hotpath", "hotpath/hotpath-callgrind" ]
hotpath-cloud         = [ "hotpath", "hotpath/hotpath-cloud" ]
persistence           = [ "dep:ciborium", "dep:serde", "dep:serde_json", "dep:trait-variant" ]
persistence-in-memory = [ "persistence" ]
persistence-tests     = [ "persistence" ]
serde                 = [ "dep:humantime-serde", "dep:serde" ]
test-util             = [  ]

[dependencies]
ciborium        = { workspace = true, optional = true }
derive_more     = { workspace = true, features = [ "debug", "display", "into" ] }
erased-serde    = { workspace = true, optional = true }
flume           = { workspace = true, features = [ "async" ] }
hotpath         = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
postcard        = { workspace = true, features = [ "use-std" ], optional = true }
quinn           = { workspace = true, features = [ "runtime-tokio", "rustls-ring" ], optional = true }
rcgen           = { workspace = true, features = [ "crypto", "ring" ], optional = true }
rustls          = { workspace = true, features = [ "ring", "std" ], optional = true }
serde           = { workspace = true, features = [ "derive" ], optional = true }
serde_json      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tokio           = { workspace = true, features = [ "macros", "rt", "sync", "time" ] }
tracing         = { workspace = true }
trait-variant   = { workspace = true, optional = true }
uuid            = { workspace = true, features = [ "v7" ] }
x509-parser     = { workspace = true, optional = true }

[dev-dependencies]
anyhow             = { workspace = true }
axum               = { workspace = true, features = [ "http1", "tokio" ] }
config             = { workspace = true, features = [ "toml" ] }
criterion          = { workspace = true, features = [ "async_tokio" ] }
derive_more        = { workspace = true, features = [ "debug", "deref", "deref_mut" ] }
rcgen              = { workspace = true, features = [ "crypto", "pem", "ring" ] }
rustls             = { workspace = true, features = [ "ring", "std" ] }
serde              = { workspace = true, features = [ "derive" ] }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = [ "fs", "macros", "net", "process", "rt-multi-thread", "signal", "test-util", "time" ] }
tracing-subscriber = { workspace = true, features = [ "env-filter", "fmt", "json" ] }

