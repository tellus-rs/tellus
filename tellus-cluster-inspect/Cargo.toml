[package]
name          = "tellus-cluster-inspect"
description   = "An axum router observing a tellus cluster node: a state snapshot and a resumable stream of every change."
version       = "0.1.3"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/tellus-cluster-inspect/latest/tellus_cluster_inspect/"
keywords      = [ "actor", "cluster", "observability", "axum", "tellus" ]
categories    = [ "network-programming", "development-tools::debugging" ]
publish       = true

[dependencies]
axum         = { workspace = true, features = [ "http1", "json", "tokio" ] }
futures-util = { workspace = true }
serde        = { workspace = true, features = [ "derive" ] }
serde_json   = { workspace = true }
tellus       = { workspace = true, features = [ "cluster", "serde" ] }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = [ "macros", "rt", "sync", "time" ] }

[dev-dependencies]
anyhow         = { workspace = true }
http-body-util = { workspace = true }
tellus         = { workspace = true, features = [ "cluster-dev" ] }
tokio          = { workspace = true, features = [ "net", "rt-multi-thread", "signal" ] }
tower          = { workspace = true, features = [ "util" ] }
