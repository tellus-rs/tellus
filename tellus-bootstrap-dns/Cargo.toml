[package]
name          = "tellus-bootstrap-dns"
description   = "DNS seed discovery for tellus cluster bootstrap"
version       = "0.1.1"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
repository    = { workspace = true }
documentation = "https://docs.rs/tellus-bootstrap-dns/latest/tellus_bootstrap_dns/"
publish       = true

[features]
serde = [ "dep:serde" ]

[dependencies]
futures-util     = { workspace = true }
hickory-resolver = { workspace = true, features = [ "tokio" ] }
serde            = { workspace = true, features = [ "derive" ], optional = true }
thiserror        = { workspace = true }
tellus           = { workspace = true, features = [ "cluster" ] }

[dev-dependencies]
anyhow         = { workspace = true }
hickory-server = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = [ "macros", "net", "rt-multi-thread" ] }
