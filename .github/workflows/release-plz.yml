name: Release-plz

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags, separated by spaces, whose release notes are put in front of the changelog again; nothing is released
        required: true
        type: string

defaults:
  run:
    shell: bash

# No run may be dropped, since one can be the release, and the latest must run last!
concurrency:
  group: release-plz
  cancel-in-progress: false
  queue: max

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      toolchain: ${{ steps.set_toolchain.outputs.toolchain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "toolchain=$toolchain" | tee -a "$GITHUB_OUTPUT"

  release-plz:
    name: Run release-plz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: toolchain
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.toolchain }}

      - name: Run release-plz
        id: release-plz
        if: github.event_name == 'push'
        uses: MarcoIeni/release-plz-action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The semver baseline, the released crate, may predate .cargo/config.toml's version!
          K8S_OPENAPI_ENABLED_VERSION: "1.36"

      - name: Put the release notes in front of the changelog
        if: steps.release-plz.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
          TAGS: ${{ inputs.tags }}
        run: |
          git fetch --quiet --tags origin
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tags=$TAGS
          else
            tags=$(jq -r '.[].tag' <<< "$RELEASES")
          fi
          for tag in $tags; do
            git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || { echo "::error::no tag $tag"; exit 1; }
            gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
            python3 -I .github/release/release_notes.py "$tag" "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/body.md"
            if [ -s "$RUNNER_TEMP/body.md" ]; then
              gh release edit "$tag" --notes-file "$RUNNER_TEMP/body.md"
            fi
          done
