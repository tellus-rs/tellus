name: Bench

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bench-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.set_toolchain.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          stable=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "stable=$stable" | tee -a "$GITHUB_OUTPUT"

  bench-pr:
    name: Compare against merge base
    runs-on: ubuntu-latest
    needs: toolchain
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}

      - name: Install just
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The restored cache can hold a stale target/criterion, which criterion trips over and
      # bench-report globs for change data; benchmark runs must start from a clean slate.
      - name: Benchmark merge base
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          rm -rf target/criterion
          base=$(git merge-base origin/main HEAD)
          git checkout --detach "$base"
          git checkout "$GITHUB_SHA" -- justfile
          just bench-save main

      # The merge base may predate the persistence benchmark, or the features its recipe asks for,
      # since only the justfile is taken from the head; then there is no baseline, the head run
      # below is skipped and the report simply carries no persistence rows for this PR. Only those
      # cases are skipped: a failing benchmark run still fails the job, so a transient failure
      # cannot silently drop the persistence rows from bench-compare and bench-report.
      - name: Benchmark merge base (persistence)
        id: base-persistence
        run: |
          if [ -f tellus/benches/persistence.rs ] && grep -q persistence-in-memory tellus/Cargo.toml; then
            just bench-persistence-save main
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "the merge base predates the persistence benchmark or its features; skipping the baseline"
            echo "baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark PR head
        run: |
          git checkout -f --detach "$GITHUB_SHA"
          just bench-compare main

      - name: Benchmark PR head (persistence)
        if: steps.base-persistence.outputs.baseline == 'true'
        run: |
          just bench-persistence-compare main

      - name: Report
        run: |
          just bench-report | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bench
          path: report.md

  bench-main:
    name: Track on main
    runs-on: ubuntu-latest
    needs: toolchain
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}

      - name: Install just
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # See the comment on "Benchmark merge base": a stale cached target/criterion corrupts the
      # bencher output which "Store result" parses.
      - name: Benchmark
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          rm -rf target/criterion
          just bench-bencher | tee bench-output.txt

      - name: Benchmark (persistence)
        run: |
          just bench-persistence-bencher | tee bench-persistence-output.txt

      # One dashboard section per "name", all in the same data file, which is keyed by name.
      - name: Store result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo
          output-file-path: bench-output.txt
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false

      - name: Store result (persistence)
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Persistence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tool: cargo
          output-file-path: bench-persistence-output.txt
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
