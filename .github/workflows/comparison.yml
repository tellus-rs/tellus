name: Comparison

on:
  push:
    tags:
      - tellus-v*
  pull_request:
    branches:
      - main
    paths:
      - tellus-comparison/**
      - .github/workflows/comparison.yml
  workflow_dispatch:

jobs:
  toolchain:
    name: Setup Rust toolchain
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.set_toolchain.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Output toolchain
        id: set_toolchain
        run: |
          stable=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "stable=$stable" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Check comparison crate
    runs-on: ubuntu-latest
    needs: toolchain
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: just check-comparison lint-comparison
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          just check-comparison
          just lint-comparison

  publish:
    name: Publish comparison
    runs-on: ubuntu-latest
    needs: toolchain
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.toolchain.outputs.stable }}

      - name: Install just
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Resolve tag
        id: resolve
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="manual-$GITHUB_RUN_ID"
          fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

      - name: Benchmark
        run: |
          rustup override set ${{ needs.toolchain.outputs.stable }}
          just bench-comparison

      - name: Report
        run: |
          just bench-comparison-report ${{ steps.resolve.outputs.tag }}

      - name: Publish to gh-pages
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ../gh-pages origin/gh-pages

          mkdir -p "../gh-pages/comparison/$TAG"
          cp target/comparison-report/index.html "../gh-pages/comparison/$TAG/"
          cp target/comparison-report/results.json "../gh-pages/comparison/$TAG/"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            mkdir -p ../gh-pages/comparison/latest
            cp target/comparison-report/index.html target/comparison-report/results.json \
              ../gh-pages/comparison/latest/
          fi

          cargo run -p tellus-comparison --bin report -- --index ../gh-pages/comparison

          git -C ../gh-pages add comparison
          if git -C ../gh-pages diff --cached --quiet; then
            echo "no comparison changes to publish"
          else
            git -C ../gh-pages commit -m "add comparison benchmarks for $TAG"
            git -C ../gh-pages push origin HEAD:gh-pages
          fi

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-${{ steps.resolve.outputs.tag }}
          path: target/comparison-report
